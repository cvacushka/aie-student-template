[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-campus-airguard"
version = "0.1.0"
description = "End-to-end AI service for forecasting classroom CO2 risk in a smart campus."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.9.0,<1.10.0",
    "joblib>=1.3.0",
    "pydantic>=2.6.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
airguard-generate-data = "airguard.data.generate_dataset:main"
airguard-train = "airguard.models.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
